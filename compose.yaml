services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  model-loader:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull embeddinggemma && ollama pull gemma3:4b"

  app:
    build: .
    depends_on:
      model-loader:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: http://ollama:11434
      RAG_CHAT_MODEL: gemma3:4b
      RAG_EMBEDDING_MODEL: embeddinggemma
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db

volumes:
  ollama-models:
