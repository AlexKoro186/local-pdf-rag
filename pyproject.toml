[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "local-pdf-rag"
version = "1.0.0"
description = "A private, local-first RAG assistant for verifiable answers from PDF documents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Alex Koro" }]
keywords = ["rag", "ollama", "chromadb", "streamlit", "pdf", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "chromadb>=1.0,<2",
  "httpx[socks]>=0.27,<1",
  "ollama>=0.4,<1",
  "pypdf>=5,<7",
  "python-dotenv>=1,<2",
  "streamlit>=1.42,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
local-pdf-rag = "local_pdf_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_pdf_rag"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["local_pdf_rag"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "pragma: no cover"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"ingest.py" = ["E402"]
"query.py" = ["E402"]
